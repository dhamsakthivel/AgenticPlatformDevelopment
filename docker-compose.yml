services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ake
      POSTGRES_PASSWORD: ake
      POSTGRES_DB: ake
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ake"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent:
    build: ./services/agent
    environment:
      AKE_API_KEY: ${AKE_API_KEY:-dev-ake-key}
      DATABASE_URL: postgresql://ake:ake@postgres:5432/ake
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AKE_CHAT_MODEL: ${AKE_CHAT_MODEL:-gpt-4o-mini}
      AKE_EMBED_MODEL: ${AKE_EMBED_MODEL:-text-embedding-3-small}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-ake-user-story}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  platform:
    build: ./services/platform
    environment:
      AKE_PROFILE: cloud
      AKE_API_KEY: ${AKE_API_KEY:-dev-ake-key}
      AKE_AGENT_URL: http://agent:8000
      AKE_AGENT_API_KEY: ${AKE_API_KEY:-dev-ake-key}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ake
      SPRING_DATASOURCE_USERNAME: ake
      SPRING_DATASOURCE_PASSWORD: ake
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/ake
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AKE_CHAT_MODEL: ${AKE_CHAT_MODEL:-gpt-4o-mini}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  web:
    build: ./apps/web
    environment:
      PLATFORM_API_URL: http://platform:8080
      PLATFORM_API_KEY: ${AKE_API_KEY:-dev-ake-key}
    ports:
      - "3000:3000"
    depends_on:
      - platform
