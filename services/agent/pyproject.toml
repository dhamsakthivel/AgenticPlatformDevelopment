[project]
name = "ake-agent"
version = "0.1.0"
description = "AKE user-story agent: LangGraph, LangChain RAG, MCP, and LangSmith hooks"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "langchain-core>=0.3.28",
  "langchain-openai>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.60",
  "langsmith>=0.2.10",
  "mcp>=1.9.0",
  "psycopg[binary]>=3.2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
